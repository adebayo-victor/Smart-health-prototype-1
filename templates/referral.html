{% extends "base.html" %}

{% block content %}
<div class="pb-32">
    <div class="flex items-center gap-3 mb-6">
        <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        </a>
        <h1 class="text-xl font-black text-slate-800">Generate Referral</h1>
    </div>

    <!-- Input Form -->
    <div id="referralForm" class="bg-white p-4 rounded-xl border border-slate-200 mb-6 space-y-4">
        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Patient Name *</label>
            <input type="text" id="patient_name" class="w-full min-h-12 px-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., Amina Yusuf">
        </div>

        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Destination Center *</label>
            <select id="center_select" class="w-full min-h-12 px-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="" disabled selected>Loading centers...</option>
            </select>
        </div>

        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-2">Reason for Referral *</label>
            <div class="flex flex-wrap gap-2 mb-3">
                <button type="button" onclick="addTag('Obstructed Labor')" class="px-3 py-1 bg-red-50 text-red-700 text-xs font-bold rounded-full border border-red-200 hover:bg-red-100">Obstructed Labor</button>
                <button type="button" onclick="addTag('Severe Bleeding')" class="px-3 py-1 bg-red-50 text-red-700 text-xs font-bold rounded-full border border-red-200 hover:bg-red-100">Severe Bleeding</button>
                <button type="button" onclick="addTag('High BP / Preeclampsia')" class="px-3 py-1 bg-amber-50 text-amber-700 text-xs font-bold rounded-full border border-amber-200 hover:bg-amber-100">High BP</button>
                <button type="button" onclick="addTag('Facility at Capacity')" class="px-3 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-full border border-slate-200 hover:bg-slate-200">Center Full</button>
            </div>
            <textarea id="reason" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Describe the reason for referral..."></textarea>
        </div>

        <button onclick="generateReferral()" class="w-full min-h-14 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-700 transition">
            Generate Referral & Code
        </button>
    </div>

    <!-- Result Card (Hidden initially) -->
    <div id="referralCard" class="hidden bg-white p-6 rounded-2xl border-2 border-dashed border-slate-300 text-center space-y-4">
        <p class="text-[10px] font-black uppercase text-slate-400">Referral Code</p>
        <h2 id="displayCode" class="text-4xl font-black text-slate-800 tracking-wider"></h2>
        
        <!-- Backend-generated QR Image -->
        <img id="qrImg" class="mx-auto w-40 h-40 rounded-lg border border-slate-200 bg-white p-2" alt="Referral QR" style="display:none">
        
        <div class="text-left bg-slate-50 p-4 rounded-xl space-y-2">
            <p class="text-xs"><span class="font-bold text-slate-500">Patient:</span> <span id="displayName" class="font-bold text-slate-800"></span></p>
            <p class="text-xs"><span class="font-bold text-slate-500">Destination:</span> <span id="displayFacility" class="font-bold text-slate-800"></span></p>
            <p class="text-xs"><span class="font-bold text-slate-500">Reason:</span> <span id="displayReason" class="font-bold text-slate-800"></span></p>
        </div>
        
        <button onclick="window.print()" class="w-full min-h-12 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition">
            Print / Save as PDF
        </button>
        <a href="/" class="block text-sm font-bold text-slate-500 hover:text-slate-800">Return Home</a>
    </div>
</div>

<script>
let currentEncounterId = null;

// Read encounter_id + name from URL (when arriving via "Refer Patient" button from Triage/Diagnosis)
const params = new URLSearchParams(window.location.search);
if (params.get('encounter_id')) currentEncounterId = params.get('encounter_id');
if (params.get('patient_name')) document.getElementById('patient_name').value = params.get('patient_name');

// 1. Load Centers on Page Load
fetch('/api/centers')
    .then(res => res.json())
    .then(centers => {
        const select = document.getElementById('center_select');
        select.innerHTML = '<option value="" disabled selected>Select a destination center...</option>';
        centers.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.name} (${c.location})</option>`;
        });
    });

// 2. Quick Tags Logic
function addTag(text) {
    const textarea = document.getElementById('reason');
    textarea.value += (textarea.value ? ', ' : '') + text;
}

// 3. Generate Referral
async function generateReferral() {
    const patientName = document.getElementById('patient_name').value.trim();
    const centerId = document.getElementById('center_select').value;
    const reason = document.getElementById('reason').value.trim();

    if (!patientName || !centerId || !reason) {
        alert("Please fill in all required fields.");
        return;
    }

    const body = { patient_name: patientName, center_id: centerId, reason: reason };
    if (currentEncounterId) body.encounter_id = currentEncounterId;

    try {
        const response = await fetch('/api/referral', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch (e) { throw new Error("Server returned invalid response."); }
        if (!response.ok) throw new Error(data.error || 'Server error');

        // Hide form, show card
        document.getElementById('referralForm').classList.add('hidden');
        document.getElementById('referralCard').classList.remove('hidden');
        
        document.getElementById('displayCode').innerText = data.referral_code;
        document.getElementById('displayName').innerText = data.patient_name;
        document.getElementById('displayFacility').innerText = data.facility;
        document.getElementById('displayReason').innerText = data.reason;

        // Display Backend-Generated QR Code
        const qrImg = document.getElementById('qrImg');
        qrImg.src = data.referral_qr;
        qrImg.style.display = 'block';

    } catch (error) {
        alert('Error: ' + error.message);
    }
}
</script>
{% endblock %}
