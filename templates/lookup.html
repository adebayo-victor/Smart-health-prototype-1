{% extends "base.html" %}

{% block content %}
<div class="pb-20 max-w-2xl mx-auto">
    <div class="text-center mb-8 mt-4">
        <h1 class="text-2xl font-black text-slateDark mb-2">Patient Lookup</h1>
        <p class="text-sm text-slate-500">Enter the referral code provided by the patient.</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6">
        <div class="flex gap-2">
            <input type="text" id="codeInput" class="flex-1 min-h-14 px-4 rounded-xl border-2 border-slate-200 bg-surfaceLight text-xl font-black text-center uppercase tracking-wider focus:outline-none focus:border-emerald" placeholder="e.g., AK-J8RQEE">
            <button onclick="lookupPatient()" class="min-h-14 px-6 bg-slateDark text-white rounded-xl font-bold hover:bg-slateDark/90 transition">Search</button>
        </div>
        <p id="errorMsg" class="hidden text-crimson text-sm font-bold mt-3 text-center"></p>
    </div>

    <!-- Patient Record Display -->
    <div id="patientRecord" class="hidden space-y-4">
        
        <!-- Header with Status -->
        <div class="bg-emerald/10 p-5 rounded-2xl border-2 border-emerald text-center">
            <p class="text-[10px] font-black uppercase text-emerald mb-1">Patient Identified</p>
            <h2 id="pName" class="text-2xl font-black text-slateDark"></h2>
            <p class="text-xs font-bold text-emerald mt-2">
                Code: <span id="pCode"></span> • 
                Status: <span id="pStatus" class="uppercase bg-white px-2 py-0.5 rounded text-emerald"></span>
            </p>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200">
            <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Referral Reason</p>
            <p id="pReason" class="text-sm font-bold text-slateDark"></p>
            <p class="text-xs text-slate-500 mt-2">To: <span id="pFacility" class="font-bold text-slate-700"></span></p>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200">
            <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Triage & Vitals</p>
            <p id="pTriage" class="text-sm font-medium text-slate-700"></p>
            <p id="pVitals" class="text-xs text-slate-500 mt-2"></p>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200">
            <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Diagnosis & Treatment</p>
            <p id="pDiag" class="text-sm font-medium text-slate-700"></p>
            <p id="pMeds" class="text-xs text-slate-500 mt-2"></p>
        </div>
    </div>
</div>

<script>
async function lookupPatient() {
    const code = document.getElementById('codeInput').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const record = document.getElementById('patientRecord');

    // Reset UI
    errorMsg.classList.add('hidden');
    record.classList.add('hidden');

    if (!code) { 
        errorMsg.innerText = "Please enter a referral code."; 
        errorMsg.classList.remove('hidden'); 
        return; 
    }

    try {
        const response = await fetch('/api/lookup', {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ code: code })
        });

        const raw = await response.text();
        let data; 
        try { data = JSON.parse(raw); } catch (e) { throw new Error("Server error."); }
        
        if (!response.ok) throw new Error(data.error || 'Patient not found.');

        // Safe setter function to prevent "null" crashes
        const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = val || ''; };

        // Populate Data
        setTxt('pName', data.patient_name);
        setTxt('pCode', data.referral_code);
        setTxt('pStatus', data.referral_status); // This was the missing piece!
        setTxt('pReason', data.reason);
        setTxt('pFacility', data.facility);
        setTxt('pTriage', data.triage_notes || "No triage notes available.");
        setTxt('pDiag', data.diagnosis || "No diagnosis recorded.");
        setTxt('pMeds', data.medications ? "Meds: " + data.medications : "");
        
        const vKeys = Object.keys(data.vitals || {});
        setTxt('pVitals', vKeys.length ? "Vitals: " + vKeys.map(k => `${k}: ${data.vitals[k]}`).join(", ") : "");

        // Show Record
        record.classList.remove('hidden');

    } catch (error) {
        errorMsg.innerText = error.message;
        errorMsg.classList.remove('hidden');
    }
}
</script>
{% endblock %}
