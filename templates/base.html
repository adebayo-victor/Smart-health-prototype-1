<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHealth PWA</title>
    
    <!-- PWA MANIFEST LINK -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0F172A">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Design Tokens -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: '#059669',
                        amber: '#D97706',
                        crimson: '#DC2626',
                        slateDark: '#0F172A',
                        surfaceLight: '#F8FAFC',
                        skyBlue: '#0284C7',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-slateDark text-white p-4 shadow-md">
        <div class="max-w-2xl mx-auto flex flex-col gap-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-emerald rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                </div>
                <h1 class="text-lg font-black tracking-tight">SmartHealth PWA</h1>
            </div>
            <!-- Quick Nav (Added Lookup here) -->
            <nav class="flex gap-2 text-xs font-bold overflow-x-auto pb-1">
                <a href="/" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Home</a>
                <a href="/dashboard" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Dashboard</a>
                <a href="/translator" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Translator</a>
                <a href="/triage" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Triage</a>
                <a href="/diagnosis" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Diagnosis</a>
                <a href="/referral" class="px-3 py-1 bg-white/10 rounded-full hover:bg-white/20 whitespace-nowrap">Referral</a>
                <a href="/lookup" class="px-3 py-1 bg-emerald rounded-full hover:bg-emerald/90 text-white whitespace-nowrap">Lookup</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-2xl mx-auto w-full p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- SERVICE WORKER REGISTRATION -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>

</body>
</html>
