{% extends "base.html" %}

{% block content %}
<div class="flex flex-col justify-center min-h-[60vh] max-w-sm mx-auto w-full space-y-6">
    <div class="space-y-2">
        <h2 class="text-2xl font-black text-slateDark">Health Worker Login</h2>
        <p class="text-sm text-slate-500">Enter your credentials to access the clinical tool.</p>
    </div>

    <div class="space-y-2">
        <label class="text-xs font-bold text-slate-700 uppercase">Worker ID</label>
        <input type="text" placeholder="e.g., CHEW-4092" class="w-full min-h-14 px-4 rounded-xl border border-slate-200 bg-white text-lg font-bold focus:outline-none focus:ring-2 focus:ring-emerald">
        <p class="text-xs text-slate-400 italic pl-1">Your ID is issued by your center.</p>
    </div>

    <a href="/translator" class="block w-full min-h-14 bg-emerald hover:bg-emerald/90 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition shadow-md mt-4">
        Proceed
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
    </a>
    
    <a href="/" class="text-center text-sm font-bold text-slate-500 hover:text-slateDark mt-4">← Back to Home</a>
</div>
{% endblock %}
