{% extends "base.html" %}

{% block content %}
<div class="pb-20">
    <div class="flex items-center gap-3 mb-6">
        <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        </a>
        <h1 class="text-xl font-black text-slate-800">Systemic Footprint Diagnosis</h1>
    </div>

    <!-- Input Form -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6 space-y-4">
        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Patient Name *</label>
            <input type="text" id="patient_name" class="w-full min-h-12 px-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., Amina Yusuf">
        </div>
        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Symptoms / Chief Complaint *</label>
            <textarea id="symptoms" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., High fever for 3 days, yellowing of eyes, dark urine."></textarea>
        </div>
    </div>

    <!-- Vitals Grid (Same as Triage) -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Temp (°C)</label>
            <input type="number" id="temp" step="0.1" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="37.0">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Heart Rate (BPM)</label>
            <input type="number" id="hr" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="75">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Sys BP (mmHg)</label>
            <input type="number" id="sys_bp" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="120">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Dia BP (mmHg)</label>
            <input type="number" id="dia_bp" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="80">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 col-span-2">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">SpO2 (%)</label>
            <input type="number" id="spo2" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="98">
        </div>
    </div>

    <!-- Save Button -->
    <button onclick="saveDiagnosis()" class="w-full min-h-14 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-700 transition mb-6">
        Save Diagnosis
    </button>

    <!-- Simple Success Message -->
    <div id="successMessage" class="hidden p-4 bg-emerald-50 border-2 border-emerald-500 rounded-xl text-center">
        <p class="text-emerald-800 font-bold">✅ Diagnosis successfully saved to patient record.</p>
    </div>
</div>

<script>
async function saveDiagnosis() {
    const patientName = document.getElementById('patient_name').value.trim();
    const symptoms = document.getElementById('symptoms').value.trim();

    if (!patientName || !symptoms) {
        alert("Patient name and symptoms are required.");
        return;
    }

    const payload = {
        patient_name: patientName,
        symptoms: symptoms,
        temp: parseFloat(document.getElementById('temp').value) || null,
        hr: parseFloat(document.getElementById('hr').value) || null,
        sys_bp: parseFloat(document.getElementById('sys_bp').value) || null,
        dia_bp: parseFloat(document.getElementById('dia_bp').value) || null,
        spo2: parseFloat(document.getElementById('spo2').value) || null
    };

    try {
        const response = await fetch('/api/diagnosis', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch (e) { throw new Error("Server returned invalid response."); }
        
        if (!response.ok) throw new Error(data.error || 'Server error');

        // Show simple success message
        document.getElementById('successMessage').classList.remove('hidden');
        
        // Optional: Clear form after saving
        // document.getElementById('patient_name').value = '';
        // document.getElementById('symptoms').value = '';

    } catch (error) {
        alert('Error: ' + error.message);
    }
}
</script>
{% endblock %}
