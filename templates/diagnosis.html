{% extends "base.html" %}

{% block content %}
<div class="pb-20">
    <div class="flex items-center gap-3 mb-6">
        <a href="/" class="w-10 h-10 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        </a>
        <h1 class="text-xl font-black text-slate-800">Systemic Footprint Diagnosis</h1>
    </div>

    <!-- Input Form -->
    <div id="inputForm" class="bg-white p-4 rounded-xl border border-slate-200 mb-6 space-y-4">
        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Patient Name *</label>
            <input type="text" id="patient_name" class="w-full min-h-12 px-3 rounded-lg border border-slate-200 bg-slate-50 text-base font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., Amina Yusuf">
        </div>
        <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Symptoms / Chief Complaint *</label>
            <textarea id="symptoms" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., High fever for 3 days, yellowing of eyes."></textarea>
        </div>
    </div>

    <!-- Vitals Grid -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Temp (°C)</label>
            <input type="number" id="temp" step="0.1" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="37.0">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Heart Rate</label>
            <input type="number" id="hr" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="BPM">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Sys BP</label>
            <input type="number" id="sys_bp" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="120">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Dia BP</label>
            <input type="number" id="dia_bp" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="80">
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 col-span-2">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">SpO2 (%)</label>
            <input type="number" id="spo2" class="w-full min-h-12 px-2 rounded-lg border border-slate-200 bg-slate-50 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="98">
        </div>
    </div>

    <!-- Step 1 Button -->
    <button id="analyzeBtn" onclick="analyzeSymptoms()" class="w-full min-h-14 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-700 transition mb-6">
        Analyze Symptoms
    </button>

    <!-- Loading State -->
    <div id="loadingState" class="hidden flex items-center justify-center gap-2 py-6 text-emerald-600 bg-emerald-50 rounded-xl mb-6">
        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="font-bold">Running Systemic Footprint Analysis...</span>
    </div>

    <!-- Step 2: Selection UI (Hidden initially) -->
    <div id="selectionArea" class="hidden space-y-4">
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
            <p class="text-[10px] font-black uppercase text-blue-700 mb-1">AI Clinical Reasoning</p>
            <p id="aiReasoning" class="text-sm font-medium text-blue-900"></p>
        </div>

        <div>
            <p class="text-[10px] font-black uppercase text-slate-400 mb-2">Select the Correct Diagnosis</p>
            <div id="optionsContainer" class="space-y-2"></div>
        </div>

        <!-- Step 2 Button -->
        <button id="confirmBtn" onclick="confirmDiagnosis()" disabled class="w-full min-h-14 bg-emerald-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
            Confirm & Save Diagnosis
        </button>
    </div>

    <!-- Success Message -->
    <div id="successMessage" class="hidden p-4 bg-emerald-50 border-2 border-emerald-500 rounded-xl text-center mt-4">
        <p class="text-emerald-800 font-bold">✅ Diagnosis successfully saved to patient record.</p>
    </div>
</div>

<script>
let currentEncounterId = null;
let selectedDiagnosis = null;

async function analyzeSymptoms() {
    const patientName = document.getElementById('patient_name').value.trim();
    const symptoms = document.getElementById('symptoms').value.trim();

    if (!patientName || !symptoms) {
        alert("Patient name and symptoms are required.");
        return;
    }

    document.getElementById('analyzeBtn').classList.add('hidden');
    document.getElementById('loadingState').classList.remove('hidden');
    document.getElementById('selectionArea').classList.add('hidden');
    document.getElementById('successMessage').classList.add('hidden');

    const payload = {
        patient_name: patientName,
        symptoms: symptoms,
        temp: parseFloat(document.getElementById('temp').value) || null,
        hr: parseFloat(document.getElementById('hr').value) || null,
        sys_bp: parseFloat(document.getElementById('sys_bp').value) || null,
        dia_bp: parseFloat(document.getElementById('dia_bp').value) || null,
        spo2: parseFloat(document.getElementById('spo2').value) || null
    };

    try {
        const response = await fetch('/api/diagnosis', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch (e) { throw new Error("Server returned invalid response."); }
        if (!response.ok) throw new Error(data.error || 'Server error');

        currentEncounterId = data.encounter_id;
        renderOptions(data.options, data.reasoning);
    } catch (error) {
        alert('Error: ' + error.message);
        document.getElementById('analyzeBtn').classList.remove('hidden');
    } finally {
        document.getElementById('loadingState').classList.add('hidden');
    }
}

function renderOptions(options, reasoning) {
    document.getElementById('selectionArea').classList.remove('hidden');
    document.getElementById('aiReasoning').innerText = reasoning;
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    selectedDiagnosis = null;
    document.getElementById('confirmBtn').disabled = true;

    options.forEach((opt, index) => {
        container.innerHTML += `
            <label class="flex items-center gap-3 p-4 bg-white rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition option-card" onclick="selectOption(this, '${opt.replace(/'/g, "\\'")}')">
                <input type="radio" name="diagnosis_choice" class="w-5 h-5 text-emerald-600 focus:ring-emerald-500">
                <span class="text-sm font-bold text-slate-800">${opt}</span>
            </label>
        `;
    });
}

function selectOption(element, diagnosis) {
    // Remove active style from all cards
    document.querySelectorAll('.option-card').forEach(card => {
        card.classList.remove('border-emerald-500', 'bg-emerald-50');
        card.classList.add('border-slate-200', 'bg-white');
    });
    // Add active style to selected card
    element.classList.remove('border-slate-200', 'bg-white');
    element.classList.add('border-emerald-500', 'bg-emerald-50');
    
    selectedDiagnosis = diagnosis;
    document.getElementById('confirmBtn').disabled = false;
}

async function confirmDiagnosis() {
    if (!selectedDiagnosis || !currentEncounterId) return;

    document.getElementById('confirmBtn').innerText = 'Saving...';
    document.getElementById('confirmBtn').disabled = true;

    try {
        const response = await fetch('/api/diagnosis', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                encounter_id: currentEncounterId,
                selected_diagnosis: selectedDiagnosis
            })
        });

        const raw = await response.text();
        let data;
        try { data = JSON.parse(raw); } catch (e) { throw new Error("Server error."); }
        if (!response.ok) throw new Error(data.error || 'Server error');

        document.getElementById('selectionArea').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
        
        // Reset form for next patient
        document.getElementById('patient_name').value = '';
        document.getElementById('symptoms').value = '';
        document.getElementById('analyzeBtn').classList.remove('hidden');
        document.getElementById('confirmBtn').innerText = 'Confirm & Save Diagnosis';

    } catch (error) {
        alert('Error saving: ' + error.message);
        document.getElementById('confirmBtn').disabled = false;
    }
}
</script>
{% endblock %}
